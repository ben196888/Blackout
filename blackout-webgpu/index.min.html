<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKOUT</title><link rel="icon" href="data:,"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#cfd6e4;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;pointer-events:none;user-select:none;text-shadow:0 1px 2px #000}#help{left:14px;bottom:12px;background:rgba(4,6,12,.55);border:1px solid rgba(160,180,220,.16);padding:8px 12px;border-radius:4px}#help b{color:#fff;font-weight:600}#help table{border-collapse:collapse}#help td{padding:0 10px 0 0;white-space:nowrap}#help td:first-child{color:#ffd58a}#perf{right:14px;top:12px;background:rgba(4,6,12,.6);border:1px solid rgba(160,180,220,.16);padding:8px 12px;border-radius:4px;white-space:pre;min-width:230px;display:none}#mode{left:14px;top:12px;letter-spacing:.18em;font-size:11px;opacity:.75}#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(6,9,18,.55),rgba(0,0,0,.92));cursor:pointer;text-align:center}#start h1{font-size:54px;letter-spacing:.5em;margin:0 0 0 .5em;font-weight:300;color:#e8ecf5}#start p{opacity:.7;margin:14px 0 0;letter-spacing:.12em}#start .go{margin-top:28px;padding:9px 22px;border:1px solid rgba(255,213,138,.6);color:#ffd58a;letter-spacing:.3em;border-radius:3px}#err{position:fixed;left:14px;right:14px;top:40px;color:#ff8a7a;white-space:pre-wrap;pointer-events:none}#dTitle{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;opacity:0;text-shadow:0 2px 14px #000,0 0 3px #000;color:#e8ecf5}#dTitle b{font-size:46px;font-weight:300;letter-spacing:.42em;margin-left:.42em}#dTitle span{margin-top:12px;font-size:16px;letter-spacing:.2em;color:#ffd58a}#dFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}#dBar{position:fixed;left:0;bottom:0;height:3px;width:0;background:rgba(255,213,138,.8);pointer-events:none}</style></head><body><canvas id="c"></canvas><div id="mode" class="hud"></div><div id="perf" class="hud"></div><div id="help" class="hud"><table><tr><td>W A S D</td><td>move</td><td>Mouse</td><td>look (click to capture)</td></tr><tr><td>Shift</td><td>sprint</td><td>Space</td><td>jump &nbsp;(free-cam: up)</td></tr><tr><td>F</td><td>flashlight</td><td>C</td><td>free camera &nbsp;(Q/E down/up, wheel = speed)</td></tr><tr><td>P</td><td>performance overlay</td><td>H</td><td>hide this help</td></tr><tr><td>[ &nbsp;]</td><td>render scale</td><td>Esc</td><td>release mouse</td></tr></table></div><div id="start"><h1>BLACKOUT</h1><p id="stat">generating world…</p><div class="go" id="go" style="display:none">CLICK TO ENTER</div></div><div id="err"></div><script>"use strict";const NL=16,SHADOW_RES=4096,SHADOW_EXT=250,NDUST=1400,NEMBER=90,WGSL_COMMON="\nstruct Light { pos: vec4f, col: vec4f, glow: vec4f };\nstruct Globals {\n  viewProj: mat4x4f,\n  shadowVP: mat4x4f,\n  camPos: vec4f,    // w = time\n  camRight: vec4f,  // scaled by tan(fov/2)*aspect\n  camUp: vec4f,     // scaled by tan(fov/2)\n  camFwd: vec4f,\n  flPos: vec4f,     // w = flashlight intensity\n  flDir: vec4f,\n  moonDir: vec4f,\n  moonCol: vec4f,\n  misc: vec4f,      // x fog density, y exposure, zw resolution\n  lights: array<Light, 16>,\n};\n@group(0) @binding(0) var<uniform> G: Globals;\n\nfn hash12(p: vec2f) -> f32 { var p3 = fract(vec3f(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }\nfn hash13(p: vec3f) -> f32 { var p3 = fract(p * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }\nfn hash22(p: vec2f) -> vec2f { var p3 = fract(vec3f(p.xyx) * vec3f(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }\nfn hash33(p: vec3f) -> vec3f { var p3 = fract(p * vec3f(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }\nfn vnoise(p: vec2f) -> f32 {\n  let i = floor(p); let f = fract(p); let u = f * f * (3.0 - 2.0 * f);\n  return mix(mix(hash12(i), hash12(i + vec2f(1, 0)), u.x), mix(hash12(i + vec2f(0, 1)), hash12(i + vec2f(1, 1)), u.x), u.y);\n}\nfn vnoise3(p: vec3f) -> f32 {\n  let i = floor(p); let f = fract(p); let u = f * f * (3.0 - 2.0 * f);\n  let a = mix(mix(hash13(i), hash13(i + vec3f(1, 0, 0)), u.x), mix(hash13(i + vec3f(0, 1, 0)), hash13(i + vec3f(1, 1, 0)), u.x), u.y);\n  let b = mix(mix(hash13(i + vec3f(0, 0, 1)), hash13(i + vec3f(1, 0, 1)), u.x), mix(hash13(i + vec3f(0, 1, 1)), hash13(i + vec3f(1, 1, 1)), u.x), u.y);\n  return mix(a, b, u.z);\n}\nfn fbm2(p0: vec2f, oct: i32) -> f32 {\n  var p = p0; var a = 0.5; var s = 0.0;\n  for (var i = 0; i < oct; i++) { s += a * vnoise(p); p = p * 2.03 + vec2f(17.3, 9.1); a *= 0.5; }\n  return s;\n}\n// base night sky gradient + moon scatter. Shared by sky, fog and reflections so they always agree.\nfn skyBase(d: vec3f) -> vec3f {\n  let h = max(d.y, 0.0);\n  let zen = vec3f(0.0045, 0.0085, 0.021);\n  let hor = vec3f(0.024, 0.037, 0.064);\n  var c = mix(hor, zen, pow(h, 0.42));\n  let md = max(dot(d, G.moonDir.xyz), 0.0);\n  c += G.moonCol.rgb * (0.035 * pow(md, 5.0) + 0.16 * pow(md, 48.0));\n  return c;\n}\nfn fogFactor(v: vec3f, dist: f32) -> f32 {\n  let k = 0.035;\n  let a = exp(-k * clamp(G.camPos.y + 5.0, -10.0, 400.0));\n  let dy = v.y;\n  var od = G.misc.x * dist * a;\n  if (abs(dy) > 0.01) { od *= (1.0 - exp(-k * dy)) / (k * dy); }\n  return 1.0 - exp(-od);\n}\nfn fogColor(d: vec3f) -> vec3f {\n  return skyBase(normalize(vec3f(d.x, max(d.y, 0.0) * 0.5 + 0.015, d.z)));\n}\nfn flashCone(c: f32) -> f32 {\n  // hot spot, corona and dim spill of a reflector flashlight\n  let spot = smoothstep(0.972, 0.992, c);\n  let corona = smoothstep(0.90, 0.972, c);\n  let spill = smoothstep(0.62, 0.90, c);\n  let ring = 1.0 + 0.10 * sin(acos(clamp(c, -1.0, 1.0)) * 85.0) * corona * (1.0 - spot);\n  return (spot * 1.0 + corona * 0.30 + spill * 0.035) * ring;\n}\n",WGSL_SCENE=WGSL_COMMON+"\n@group(1) @binding(0) var shadowTex: texture_depth_2d;\n@group(1) @binding(1) var shadowSamp: sampler_comparison;\n\nstruct VIn { @location(0) pos: vec3f, @location(1) nrm: vec4f, @location(2) col: vec4f };\nstruct VOut {\n  @builtin(position) clip: vec4f,\n  @location(0) wpos: vec3f,\n  @location(1) nrm: vec3f,\n  @location(2) col: vec3f,\n  @location(3) param: f32,\n  @location(4) @interpolate(flat) mat: u32,\n};\n@vertex fn vs(in: VIn) -> VOut {\n  var o: VOut;\n  var p = in.pos;\n  let m = u32(in.col.a * 255.0 + 0.5);\n  let t = G.camPos.w;\n  if (m == 9u) {\n    let w = in.nrm.w;\n    p.x += (sin(t * 0.9 + p.x * 0.31 + p.z * 0.27) * 0.11 + sin(t * 2.3 + p.z * 1.3 + p.y) * 0.025) * w;\n    p.z += cos(t * 0.7 + p.x * 0.21 + p.y * 0.4) * 0.08 * w;\n  } else if (m == 11u) {\n    let w = in.nrm.w * in.nrm.w;\n    let gust = sin(t * 1.3 + p.x * 0.45 + p.z * 0.35) + 0.5 * sin(t * 2.9 + p.x * 1.7 - p.z * 1.1);\n    p.x += gust * 0.07 * w; p.z += gust * 0.05 * w;\n    let d = distance(p.xz, G.camPos.xz);\n    p.y -= smoothstep(70.0, 92.0, d) * in.nrm.w * 1.1;\n  }\n  o.clip = G.viewProj * vec4f(p, 1.0);\n  o.wpos = p; o.nrm = in.nrm.xyz; o.col = in.col.rgb; o.param = in.nrm.w; o.mat = m;\n  return o;\n}\n\nfn ggx(N: vec3f, V: vec3f, L: vec3f, rough: f32, f0: f32) -> f32 {\n  let H = normalize(V + L);\n  let nh = max(dot(N, H), 0.0);\n  let a = rough * rough; let a2 = a * a;\n  let d = nh * nh * (a2 - 1.0) + 1.0;\n  let D = a2 / (3.14159 * d * d + 1e-5);\n  let F = f0 + (1.0 - f0) * pow(1.0 - max(dot(V, H), 0.0), 5.0);\n  return min(D * F * 0.25, 40.0) * max(dot(N, L), 0.0);\n}\nfn shadow(P: vec3f, N: vec3f) -> f32 {\n  let sp = G.shadowVP * vec4f(P + N * 0.12, 1.0);\n  let uv = sp.xy * vec2f(0.5, -0.5) + 0.5;\n  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { return 1.0; }\n  var s = 0.0;\n  let ts = 1.35 / 4096.0;\n  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {\n    s += textureSampleCompareLevel(shadowTex, shadowSamp, uv + vec2f(f32(x), f32(y)) * ts, sp.z - 0.0007);\n  } }\n  return s / 9.0;\n}\nfn lightIdx(param: f32) -> i32 { return i32(round(param * 32.0)) - 1; }\n\n@fragment fn fs(in: VOut) -> @location(0) vec4f {\n  let P = in.wpos;\n  let toCam = G.camPos.xyz - P;\n  let dist = length(toCam);\n  let V = toCam / dist;\n  var Ng = normalize(in.nrm);\n  let m = in.mat;\n  if (m != 0u && m != 12u && dot(Ng, V) < 0.0) { Ng = -Ng; }\n  var T = vec3f(1, 0, 0); var B = vec3f(0, 0, 1);\n  if (abs(Ng.y) < 0.97) { T = normalize(cross(vec3f(0, 1, 0), Ng)); B = cross(Ng, T); }\n  let uv = vec2f(dot(P, T), dot(P, B));\n  let t = G.camPos.w;\n  let near = 1.0 - smoothstep(25.0, 60.0, dist);   // detail fade\n\n  var alb = in.col;\n  var rough = 0.9; var f0 = 0.03;\n  var emit = vec3f(0.0);\n  var N = Ng;\n  var wet = 0.0;      // mirror-like sky reflection amount\n  var trans = 0.0;    // back-light translucency\n  var bumpAmt = 0.25; var bumpFreq = 14.0;\n\n  switch (m) {\n    case 0u: { // terrain: grass / dirt / rock / forest floor\n      let p = P.xz;\n      let n1 = fbm2(p * 0.07, 3); let n2 = vnoise(p * 1.7); let n3 = vnoise(p * 9.0);\n      var grass = mix(vec3f(0.022, 0.036, 0.012), vec3f(0.055, 0.064, 0.022), n1);\n      grass = mix(grass, vec3f(0.085, 0.078, 0.036), smoothstep(0.5, 0.75, fbm2(p * 0.023 + 40.0, 2)));\n      grass *= 0.65 + 0.7 * n2;\n      var dirt = mix(vec3f(0.050, 0.037, 0.026), vec3f(0.105, 0.085, 0.062), n2) * (0.7 + 0.6 * n3);\n      dirt = mix(dirt, vec3f(0.12, 0.11, 0.10), smoothstep(0.84, 0.9, vnoise(p * 23.0)) * near * 0.7); // pebbles\n      let dw = smoothstep(0.35, 0.65, in.col.r + (n2 - 0.5) * 0.5 + (n3 - 0.5) * 0.25);\n      let rock = vec3f(0.075, 0.075, 0.08) * (0.55 + 0.9 * vnoise(p * 0.9 + P.y * 0.7)) * (0.8 + 0.4 * n3);\n      let rw = smoothstep(0.22, 0.42, (1.0 - Ng.y) + (n2 - 0.5) * 0.12);\n      let forest = vec3f(0.014, 0.024, 0.014) * (0.5 + 1.2 * vnoise(p * 0.11)) * (0.6 + 0.8 * vnoise(p * 0.5));\n      alb = mix(mix(grass, dirt, dw), rock, rw);\n      alb = mix(alb, forest, in.col.g * (1.0 - rw * 0.7));\n      let mud = dw * smoothstep(0.60, 0.68, vnoise(p * 0.31 + 5.0)) * (1.0 - rw) + in.col.b;\n      wet = clamp(mud, 0.0, 1.0) * 0.6;\n      alb *= 1.0 - 0.5 * wet;\n      rough = mix(0.95, 0.38, wet);\n      bumpAmt = mix(0.45, 0.05, wet); bumpFreq = 7.0;\n    }\n    case 1u: { // plaster / stucco\n      let n = fbm2(uv * 1.3, 4);\n      let streak = vnoise(vec2f(uv.x * 4.0, uv.y * 0.35));\n      alb = in.col * (0.62 + 0.55 * n) * (0.8 + 0.3 * streak);\n      let damp = smoothstep(0.55, 0.75, fbm2(uv * 0.45 + 9.0, 3));\n      alb = mix(alb, alb * vec3f(0.45, 0.5, 0.42), damp * 0.8);\n      let crack = smoothstep(0.016, 0.0, abs(vnoise(uv * 2.2 + 3.0) - 0.5)) * smoothstep(0.45, 0.6, vnoise(uv * 0.6));\n      alb *= 1.0 - 0.7 * crack * near;\n      let patchy = smoothstep(0.66, 0.70, fbm2(uv * 0.8 + 21.0, 3));  // fallen render exposing brick\n      alb = mix(alb, vec3f(0.11, 0.05, 0.035) * (0.6 + 0.8 * hash12(floor(uv * vec2f(4.5, 13.0)))), patchy * near);\n      rough = 0.92; bumpAmt = 0.5; bumpFreq = 22.0;\n    }\n    case 2u: { // brick\n      var q = uv / vec2f(0.24, 0.08);\n      let row = floor(q.y);\n      q.x += 0.5 * (row - 2.0 * floor(row * 0.5));\n      let id = floor(q); let f = fract(q);\n      let e = min(min(f.x, 1.0 - f.x) * 3.0, min(f.y, 1.0 - f.y));\n      let mort = 1.0 - smoothstep(0.06, 0.14, e);\n      let h = hash12(id);\n      var brick = in.col * (0.55 + 0.8 * h) * (0.8 + 0.4 * vnoise(uv * 30.0));\n      brick = mix(brick, brick * vec3f(0.3, 0.3, 0.32), smoothstep(0.55, 0.8, fbm2(uv * 0.5, 3)) * 0.7); // soot\n      alb = mix(brick, vec3f(0.13, 0.125, 0.115) * (0.7 + 0.5 * vnoise(uv * 40.0)), mort * mix(0.4, 1.0, near));\n      N = normalize(N + (T * (smoothstep(0.1, 0.0, f.x) - smoothstep(0.9, 1.0, hstep(0.42, 0.68, fbm2(vec2f(uv.x * 1.6, uv.y * 0.5), 4) + (1.0 - fract(uv.y * 0.31)) * 0.08);\n      let rcol = mix(vec3f(0.16, 0.06, 0.02), vec3f(0.07, 0.03, 0.015), vnoise(uv * 9.0));\n      alb = mix(in.col * (0.8 + 0.25 * vnoise(uv * vec2f(3.0, 0.4))), rcol, rust);\n      alb *= 1.0 - 0.5 * smoothstep(0.015, 0.0, abs(fract(uv.y / 1.9) - 0.5) - 0.48) * near; // sheet overlaps\n      N = normalize(N + T * cos(ph) * 0.55 * mix(0.25, 1.0, near));\n      rough = mix(0.42, 0.9, rust); f0 = mix(0.5, 0.05, rust); bumpAmt = 0.12; bumpFreq = 60.0;\n    }\n    case 6u: { // asphalt (wet after rain) + worn paint\n      let p = P.xz;\n      let sp = vnoise(p * 55.0);\n      var a = vec3f(0.060, 0.061, 0.066) * (0.6 + 0.8 * sp) * (0.7 + 0.5 * vnoise(p * 0.6));\n      let crack = smoothstep(0.022, 0.0, abs(fbm2(p * 0.55, 3) - 0.47)) + smoothstep(0.02, 0.0, abs(vnoise(p * 1.9 + 8.0) - 0.5)) * 0.6;\n      a *= 1.0 - 0.75 * min(crack, 1.0) * mix(0.3, 1.0, near);\n      if (in.param > 0.5) { // paint\n        let wear = smoothstep(0.35, 0.6, vnoise(p * 3.0) * 0.6 + sp * 0.5);\n        a = mix(a, in.col, wear * 0.85);\n      } else {\n        a = mix(a, vec3f(0.055, 0.045, 0.03), smoothstep(0.6, 0.8, fbm2(p * 0.19 + 2.0, 3)) * 0.7); // dirt drift\n      }\n      wet = smoothstep(0.50, 0.60, fbm2(p * 0.23 + 11.0, 3)) * 0.95;\n      alb = a * (1.0 - 0.55 * wet);\n      rough = mix(0.62, 0.05, wet); f0 = 0.04; bumpAmt = mix(0.45, 0.02, wet); bumpFreq = 45.0;\n    }\n    case 7u: { // concrete\n      let n = fbm2(uv * 1.1, 4);\n      alb = in.col * (0.55 + 0.7 * n) * (0.85 + 0.3 * vnoise(uv * 35.0));\n      let streak = smoothstep(0.5, 0.9, vnoise(vec2f(uv.x * 5.0, uv.y * 0.4 + 3.0)));\n      alb *= 1.0 - 0.45 * streak;\n      let seam = smoothstep(0.012, 0.0, abs(fract(uv.x / 2.4) - 0.5) - 0.488) + smoothstep(0.012, 0.0, abs(fract(uv.y / 1.2) - 0.5) - 0.488);\n      alb *= 1.0 - 0.5 * min(seam, 1.0) * near;\n      rough = 0.85; bumpAmt = 0.4; bumpFreq = 25.0;\n    }\n    case 8u: { /
