<script>
'use strict';
/* =====================================================================
   BLACKOUT — native WebGPU, single file, fully procedural.
   ===================================================================== */
const NL = 16;               // emergency lights
const SHADOW_RES = 4096;
const SHADOW_EXT = 250;      // half extent of the moon shadow map (m)
const NDUST = 1400, NEMBER = 90;

// ----------------------------------------------------------------- WGSL
const WGSL_COMMON = /* wgsl */`
struct Light { pos: vec4f, col: vec4f, glow: vec4f };
struct Globals {
  viewProj: mat4x4f,
  shadowVP: mat4x4f,
  camPos: vec4f,    // w = time
  camRight: vec4f,  // scaled by tan(fov/2)*aspect
  camUp: vec4f,     // scaled by tan(fov/2)
  camFwd: vec4f,
  flPos: vec4f,     // w = flashlight intensity
  flDir: vec4f,
  moonDir: vec4f,
  moonCol: vec4f,
  misc: vec4f,      // x fog density, y exposure, zw resolution
  lights: array<Light, ${NL}>,
};
@group(0) @binding(0) var<uniform> G: Globals;

fn hash12(p: vec2f) -> f32 { var p3 = fract(vec3f(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
fn hash13(p: vec3f) -> f32 { var p3 = fract(p * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
fn hash22(p: vec2f) -> vec2f { var p3 = fract(vec3f(p.xyx) * vec3f(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
fn hash33(p: vec3f) -> vec3f { var p3 = fract(p * vec3f(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2f(1, 0)), u.x), mix(hash12(i + vec2f(0, 1)), hash12(i + vec2f(1, 1)), u.x), u.y);
}
fn vnoise3(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p); let u = f * f * (3.0 - 2.0 * f);
  let a = mix(mix(hash13(i), hash13(i + vec3f(1, 0, 0)), u.x), mix(hash13(i + vec3f(0, 1, 0)), hash13(i + vec3f(1, 1, 0)), u.x), u.y);
  let b = mix(mix(hash13(i + vec3f(0, 0, 1)), hash13(i + vec3f(1, 0, 1)), u.x), mix(hash13(i + vec3f(0, 1, 1)), hash13(i + vec3f(1, 1, 1)), u.x), u.y);
  return mix(a, b, u.z);
}
fn fbm2(p0: vec2f, oct: i32) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var i = 0; i < oct; i++) { s += a * vnoise(p); p = p * 2.03 + vec2f(17.3, 9.1); a *= 0.5; }
  return s;
}
// base night sky gradient + moon scatter. Shared by sky, fog and reflections so they always agree.
fn skyBase(d: vec3f) -> vec3f {
  let h = max(d.y, 0.0);
  let zen = vec3f(0.0045, 0.0085, 0.021);
  let hor = vec3f(0.024, 0.037, 0.064);
  var c = mix(hor, zen, pow(h, 0.42));
  let md = max(dot(d, G.moonDir.xyz), 0.0);
  c += G.moonCol.rgb * (0.035 * pow(md, 5.0) + 0.16 * pow(md, 48.0));
  return c;
}
fn fogFactor(v: vec3f, dist: f32) -> f32 {
  let k = 0.035;
  let a = exp(-k * clamp(G.camPos.y + 5.0, -10.0, 400.0));
  let dy = v.y;
  var od = G.misc.x * dist * a;
  if (abs(dy) > 0.01) { od *= (1.0 - exp(-k * dy)) / (k * dy); }
  return 1.0 - exp(-od);
}
fn fogColor(d: vec3f) -> vec3f {
  return skyBase(normalize(vec3f(d.x, max(d.y, 0.0) * 0.5 + 0.015, d.z)));
}
fn flashCone(c: f32) -> f32 {
  // hot spot, corona and dim spill of a reflector flashlight
  let spot = smoothstep(0.972, 0.992, c);
  let corona = smoothstep(0.90, 0.972, c);
  let spill = smoothstep(0.62, 0.90, c);
  let ring = 1.0 + 0.10 * sin(acos(clamp(c, -1.0, 1.0)) * 85.0) * corona * (1.0 - spot);
  return (spot * 1.0 + corona * 0.30 + spill * 0.035) * ring;
}
`;

const WGSL_SCENE = WGSL_COMMON + /* wgsl */`
@group(1) @binding(0) var shadowTex: texture_depth_2d;
@group(1) @binding(1) var shadowSamp: sampler_comparison;

struct VIn { @location(0) pos: vec3f, @location(1) nrm: vec4f, @location(2) col: vec4f };
struct VOut {
  @builtin(position) clip: vec4f,
  @location(0) wpos: vec3f,
  @location(1) nrm: vec3f,
  @location(2) col: vec3f,
  @location(3) param: f32,
  @location(4) @interpolate(flat) mat: u32,
};
@vertex fn vs(in: VIn) -> VOut {
  var o: VOut;
  var p = in.pos;
  let m = u32(in.col.a * 255.0 + 0.5);
  let t = G.camPos.w;
  if (m == 9u) {
    let w = in.nrm.w;
    p.x += (sin(t * 0.9 + p.x * 0.31 + p.z * 0.27) * 0.11 + sin(t * 2.3 + p.z * 1.3 + p.y) * 0.025) * w;
    p.z += cos(t * 0.7 + p.x * 0.21 + p.y * 0.4) * 0.08 * w;
  } else if (m == 11u) {
    let w = in.nrm.w * in.nrm.w;
    let gust = sin(t * 1.3 + p.x * 0.45 + p.z * 0.35) + 0.5 * sin(t * 2.9 + p.x * 1.7 - p.z * 1.1);
    p.x += gust * 0.07 * w; p.z += gust * 0.05 * w;
    let d = distance(p.xz, G.camPos.xz);
    p.y -= smoothstep(70.0, 92.0, d) * in.nrm.w * 1.1;
  }
  o.clip = G.viewProj * vec4f(p, 1.0);
  o.wpos = p; o.nrm = in.nrm.xyz; o.col = in.col.rgb; o.param = in.nrm.w; o.mat = m;
  return o;
}

fn ggx(N: vec3f, V: vec3f, L: vec3f, rough: f32, f0: f32) -> f32 {
  let H = normalize(V + L);
  let nh = max(dot(N, H), 0.0);
  let a = rough * rough; let a2 = a * a;
  let d = nh * nh * (a2 - 1.0) + 1.0;
  let D = a2 / (3.14159 * d * d + 1e-5);
  let F = f0 + (1.0 - f0) * pow(1.0 - max(dot(V, H), 0.0), 5.0);
  return min(D * F * 0.25, 40.0) * max(dot(N, L), 0.0);
}
fn shadow(P: vec3f, N: vec3f) -> f32 {
  let sp = G.shadowVP * vec4f(P + N * 0.12, 1.0);
  let uv = sp.xy * vec2f(0.5, -0.5) + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { return 1.0; }
  var s = 0.0;
  let ts = 1.35 / ${SHADOW_RES}.0;
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    s += textureSampleCompareLevel(shadowTex, shadowSamp, uv + vec2f(f32(x), f32(y)) * ts, sp.z - 0.0007);
  } }
  return s / 9.0;
}
fn lightIdx(param: f32) -> i32 { return i32(round(param * 32.0)) - 1; }

@fragment fn fs(in: VOut) -> @location(0) vec4f {
  let P = in.wpos;
  let toCam = G.camPos.xyz - P;
  let dist = length(toCam);
  let V = toCam / dist;
  var Ng = normalize(in.nrm);
  let m = in.mat;
  if (m != 0u && m != 12u && dot(Ng, V) < 0.0) { Ng = -Ng; }
  var T = vec3f(1, 0, 0); var B = vec3f(0, 0, 1);
  if (abs(Ng.y) < 0.97) { T = normalize(cross(vec3f(0, 1, 0), Ng)); B = cross(Ng, T); }
  let uv = vec2f(dot(P, T), dot(P, B));
  let t = G.camPos.w;
  let near = 1.0 - smoothstep(25.0, 60.0, dist);   // detail fade

  var alb = in.col;
  var rough = 0.9; var f0 = 0.03;
  var emit = vec3f(0.0);
  var N = Ng;
  var wet = 0.0;      // mirror-like sky reflection amount
  var trans = 0.0;    // back-light translucency
  var bumpAmt = 0.25; var bumpFreq = 14.0;

  switch (m) {
    case 0u: { // terrain: grass / dirt / rock / forest floor
      let p = P.xz;
      let n1 = fbm2(p * 0.07, 3); let n2 = vnoise(p * 1.7); let n3 = vnoise(p * 9.0);
      var grass = mix(vec3f(0.022, 0.036, 0.012), vec3f(0.055, 0.064, 0.022), n1);
      grass = mix(grass, vec3f(0.085, 0.078, 0.036), smoothstep(0.5, 0.75, fbm2(p * 0.023 + 40.0, 2)));
      grass *= 0.65 + 0.7 * n2;
      var dirt = mix(vec3f(0.050, 0.037, 0.026), vec3f(0.105, 0.085, 0.062), n2) * (0.7 + 0.6 * n3);
      dirt = mix(dirt, vec3f(0.12, 0.11, 0.10), smoothstep(0.84, 0.9, vnoise(p * 23.0)) * near * 0.7); // pebbles
      let dw = smoothstep(0.35, 0.65, in.col.r + (n2 - 0.5) * 0.5 + (n3 - 0.5) * 0.25);
      let rock = vec3f(0.075, 0.075, 0.08) * (0.55 + 0.9 * vnoise(p * 0.9 + P.y * 0.7)) * (0.8 + 0.4 * n3);
      let rw = smoothstep(0.22, 0.42, (1.0 - Ng.y) + (n2 - 0.5) * 0.12);
      let forest = vec3f(0.014, 0.024, 0.014) * (0.5 + 1.2 * vnoise(p * 0.11)) * (0.6 + 0.8 * vnoise(p * 0.5));
      alb = mix(mix(grass, dirt, dw), rock, rw);
      alb = mix(alb, forest, in.col.g * (1.0 - rw * 0.7));
      let mud = dw * smoothstep(0.60, 0.68, vnoise(p * 0.31 + 5.0)) * (1.0 - rw) + in.col.b;
      wet = clamp(mud, 0.0, 1.0) * 0.6;
      alb *= 1.0 - 0.5 * wet;
      rough = mix(0.95, 0.38, wet);
      bumpAmt = mix(0.45, 0.05, wet); bumpFreq = 7.0;
    }
    case 1u: { // plaster / stucco
      let n = fbm2(uv * 1.3, 4);
      let streak = vnoise(vec2f(uv.x * 4.0, uv.y * 0.35));
      alb = in.col * (0.62 + 0.55 * n) * (0.8 + 0.3 * streak);
      let damp = smoothstep(0.55, 0.75, fbm2(uv * 0.45 + 9.0, 3));
      alb = mix(alb, alb * vec3f(0.45, 0.5, 0.42), damp * 0.8);
      let crack = smoothstep(0.016, 0.0, abs(vnoise(uv * 2.2 + 3.0) - 0.5)) * smoothstep(0.45, 0.6, vnoise(uv * 0.6));
      alb *= 1.0 - 0.7 * crack * near;
      let patchy = smoothstep(0.66, 0.70, fbm2(uv * 0.8 + 21.0, 3));  // fallen render exposing brick
      alb = mix(alb, vec3f(0.11, 0.05, 0.035) * (0.6 + 0.8 * hash12(floor(uv * vec2f(4.5, 13.0)))), patchy * near);
      rough = 0.92; bumpAmt = 0.5; bumpFreq = 22.0;
    }
    case 2u: { // brick
      var q = uv / vec2f(0.24, 0.08);
      let row = floor(q.y);
      q.x += 0.5 * (row - 2.0 * floor(row * 0.5));
      let id = floor(q); let f = fract(q);
      let e = min(min(f.x, 1.0 - f.x) * 3.0, min(f.y, 1.0 - f.y));
      let mort = 1.0 - smoothstep(0.06, 0.14, e);
      let h = hash12(id);
      var brick = in.col * (0.55 + 0.8 * h) * (0.8 + 0.4 * vnoise(uv * 30.0));
      brick = mix(brick, brick * vec3f(0.3, 0.3, 0.32), smoothstep(0.55, 0.8, fbm2(uv * 0.5, 3)) * 0.7); // soot
      alb = mix(brick, vec3f(0.13, 0.125, 0.115) * (0.7 + 0.5 * vnoise(uv * 40.0)), mort * mix(0.4, 1.0, near));
      N = normalize(N + (T * (smoothstep(0.1, 0.0, f.x) - smoothstep(0.9, 1.0, f.x)) + B * (smoothstep(0.12, 0.0, f.y) - smoothstep(0.88, 1.0, f.y))) * 0.5 * near);
      rough = 0.88; bumpAmt = 0.35; bumpFreq = 40.0;
    }
    case 3u: { // wood: siding (param 0) or vertical planks (param 1)
      var q = uv; if (in.param > 0.5) { q = uv.yx; }
      let bw = select(0.16, 0.22, in.param > 0.5);
      let row = floor(q.y / bw); let fy = fract(q.y / bw);
      let h = hash12(vec2f(row, 7.0));
      let grain = vnoise(vec2f(q.x * 1.5 + h * 40.0, q.y * 60.0)) * 0.6 + vnoise(vec2f(q.x * 6.0, q.y * 140.0 + h * 9.0)) * 0.4;
      let grey = vec3f(0.085, 0.078, 0.068) * (0.5 + 0.9 * grain) * (0.75 + 0.5 * h);
      let peel = smoothstep(0.38, 0.62, fbm2(vec2f(q.x * 0.9, q.y * 3.0) + h * 13.0, 3) + (grain - 0.5) * 0.3);
      alb = mix(in.col * (0.7 + 0.4 * grain), grey, peel);
      let gap = smoothstep(0.07, 0.0, fy) + smoothstep(0.96, 1.0, fy) * 0.5;
      alb *= 1.0 - 0.75 * gap * mix(0.4, 1.0, near);
      let lap = select(B, T, in.param > 0.5);
      N = normalize(N + lap * (fy - 0.5) * 0.35 * near);
      rough = 0.85; bumpAmt = 0.3; bumpFreq = 50.0;
    }
    case 4u: { // roof tiles / shingles
      var q = uv / vec2f(0.28, 0.34);
      let row = floor(q.y);
      q.x += 0.5 * (row - 2.0 * floor(row * 0.5));
      let id = floor(q); let f = fract(q);
      let h = hash12(id + 3.0);
      alb = in.col * (0.5 + 0.8 * h) * (0.55 + 0.6 * f.y);
      alb *= 1.0 - 0.6 * smoothstep(0.08, 0.0, min(f.x, 1.0 - f.x)) * near;
      let moss = smoothstep(0.5, 0.72, fbm2(uv * 0.7 + 4.0, 3));
      alb = mix(alb, vec3f(0.03, 0.05, 0.02) * (0.6 + 0.8 * vnoise(uv * 12.0)), moss * 0.75);
      alb = mix(alb, vec3f(0.01), step(0.955, h) * near);      // missing tiles
      N = normalize(N + B * (0.5 - f.y) * 0.45 * near + T * sin(f.x * 6.283) * 0.12 * near);
      rough = 0.8; f0 = 0.04; bumpAmt = 0.3; bumpFreq = 30.0;
    }
    case 5u: { // corrugated metal with rust
      let ph = uv.x * 6.283 / 0.085;
      let rust = smoothstep(0.42, 0.68, fbm2(vec2f(uv.x * 1.6, uv.y * 0.5), 4) + (1.0 - fract(uv.y * 0.31)) * 0.08);
      let rcol = mix(vec3f(0.16, 0.06, 0.02), vec3f(0.07, 0.03, 0.015), vnoise(uv * 9.0));
      alb = mix(in.col * (0.8 + 0.25 * vnoise(uv * vec2f(3.0, 0.4))), rcol, rust);
      alb *= 1.0 - 0.5 * smoothstep(0.015, 0.0, abs(fract(uv.y / 1.9) - 0.5) - 0.48) * near; // sheet overlaps
      N = normalize(N + T * cos(ph) * 0.55 * mix(0.25, 1.0, near));
      rough = mix(0.42, 0.9, rust); f0 = mix(0.5, 0.05, rust); bumpAmt = 0.12; bumpFreq = 60.0;
    }
    case 6u: { // asphalt (wet after rain) + worn paint
      let p = P.xz;
      let sp = vnoise(p * 55.0);
      var a = vec3f(0.060, 0.061, 0.066) * (0.6 + 0.8 * sp) * (0.7 + 0.5 * vnoise(p * 0.6));
      let crack = smoothstep(0.022, 0.0, abs(fbm2(p * 0.55, 3) - 0.47)) + smoothstep(0.02, 0.0, abs(vnoise(p * 1.9 + 8.0) - 0.5)) * 0.6;
      a *= 1.0 - 0.75 * min(crack, 1.0) * mix(0.3, 1.0, near);
      if (in.param > 0.5) { // paint
        let wear = smoothstep(0.35, 0.6, vnoise(p * 3.0) * 0.6 + sp * 0.5);
        a = mix(a, in.col, wear * 0.85);
      } else {
        a = mix(a, vec3f(0.055, 0.045, 0.03), smoothstep(0.6, 0.8, fbm2(p * 0.19 + 2.0, 3)) * 0.7); // dirt drift
      }
      wet = smoothstep(0.50, 0.60, fbm2(p * 0.23 + 11.0, 3)) * 0.95;
      alb = a * (1.0 - 0.55 * wet);
      rough = mix(0.62, 0.05, wet); f0 = 0.04; bumpAmt = mix(0.45, 0.02, wet); bumpFreq = 45.0;
    }
    case 7u: { // concrete
      let n = fbm2(uv * 1.1, 4);
      alb = in.col * (0.55 + 0.7 * n) * (0.85 + 0.3 * vnoise(uv * 35.0));
      let streak = smoothstep(0.5, 0.9, vnoise(vec2f(uv.x * 5.0, uv.y * 0.4 + 3.0)));
      alb *= 1.0 - 0.45 * streak;
      let seam = smoothstep(0.012, 0.0, abs(fract(uv.x / 2.4) - 0.5) - 0.488) + smoothstep(0.012, 0.0, abs(fract(uv.y / 1.2) - 0.5) - 0.488);
      alb *= 1.0 - 0.5 * min(seam, 1.0) * near;
      rough = 0.85; bumpAmt = 0.4; bumpFreq = 25.0;
    }
    case 8u: { // window glass (dark, dusty); optional candle-lit interior
      let dust = fbm2(uv * 2.5, 3);
      alb = vec3f(0.012, 0.014, 0.018) + vec3f(0.03, 0.028, 0.024) * smoothstep(0.4, 0.8, dust);
      rough = 0.08 + 0.3 * smoothstep(0.4, 0.8, dust); f0 = 0.08; wet = 0.55; bumpAmt = 0.0;
      let li = lightIdx(in.param);
      if (li >= 0) {
        let lc = G.lights[li].col;
        let curtain = 0.45 + 0.55 * vnoise(vec2f(uv.x * 9.0, uv.y * 0.7));
        emit = lc.rgb * lc.a * curtain * (0.25 + 0.4 * smoothstep(0.9, -0.6, fract(uv.y * 0.7)));
      } else if (in.param < -0.5) { alb = vec3f(0.004); wet = 0.0; rough = 1.0; } // broken: black void
    }
    case 9u: { // foliage
      let n = vnoise3(P * 3.1); let n2 = vnoise3(P * 11.0);
      alb = in.col * (0.45 + 0.9 * n) * (0.7 + 0.6 * n2);
      N = normalize(N + (vec3f(n, n2, vnoise3(P * 5.3 + 7.0)) - 0.5) * 0.9);
      rough = 0.75; f0 = 0.035; trans = 0.5; bumpAmt = 0.0;
    }
    case 10u: { // bark
      let n = vnoise(vec2f(uv.x * 26.0, uv.y * 3.0)) * 0.6 + vnoise(vec2f(uv.x * 60.0, uv.y * 9.0)) * 0.4;
      alb = in.col * (0.35 + 1.1 * n);
      alb = mix(alb, vec3f(0.03, 0.045, 0.02), smoothstep(0.6, 0.8, vnoise3(P * 1.3)) * 0.6);
      rough = 0.95; bumpAmt = 0.6; bumpFreq = 30.0;
    }
    case 11u: { // grass blades
      let tip = in.param;
      alb = in.col * (0.35 + 0.95 * tip);
      N = normalize(mix(vec3f(0, 1, 0), N, 0.3));
      rough = 0.7; f0 = 0.035; trans = 0.6 * tip; bumpAmt = 0.0;
    }
    case 12u: { // river water
      let p = P.xz;
      let fl = vec2f(0.05, 0.42) * t;
      let e = 0.12;
      let h0 = fbm2(p * 0.9 + fl, 3) + 0.5 * vnoise(p * 3.3 - fl * 1.7);
      let hx = fbm2((p + vec2f(e, 0)) * 0.9 + fl, 3) + 0.5 * vnoise((p + vec2f(e, 0)) * 3.3 - fl * 1.7);
      let hz = fbm2((p + vec2f(0, e)) * 0.9 + fl, 3) + 0.5 * vnoise((p + vec2f(0, e)) * 3.3 - fl * 1.7);
      N = normalize(vec3f(-(hx - h0) / e * 0.10, 1.0, -(hz - h0) / e * 0.10));
      alb = vec3f(0.004, 0.008, 0.009);
      rough = 0.06; f0 = 0.03; wet = 1.0; bumpAmt = 0.0;
    }
    case 13u: { // emissive
      let li = lightIdx(in.param);
      var k = 1.0;
      if (li >= 0) { k = G.lights[li].col.a; }

      alb = in.col * 0.2; bumpAmt = 0.0;
    }
    case 14u: { // painted metal / plastic
      let n = fbm2(uv * 3.0, 3);

      alb = mix(in.col * (0.8 + 0.3 * vnoise(uv * 1.3)), vec3f(0.10, 0.045, 0.02) * (0.5 + n), chip * 0.85);
      alb *= 0.75 + 0.35 * vnoise(vec2f(uv.x * 2.0, uv.y * 0.3));  // grime streaks
      rough = mix(0.38, 0.9, chip); f0 = 0.06; bumpAmt = 0.1; bumpFreq = 30.0;
    }
    case 15u: { // canvas
      let w = sin(uv.x * 420.0) * sin(uv.y * 420.0);
      alb = in.col * (0.8 + 0.12 * w * near) * (0.6 + 0.6 * fbm2(uv * 0.9, 3));
      alb *= 1.0 - 0.3 * smoothstep(0.5, 0.9, vnoise(vec2f(uv.x * 0.7, uv.y * 4.0)));
      N = normalize(N + T * sin(uv.x * 2.6 + vnoise(uv * 0.8) * 4.0) * 0.16); // sag folds
      rough = 0.95; trans = 0.25; bumpAmt = 0.2; bumpFreq = 60.0;
    }
    case 16u: { // field stone / boulders
      let q = uv * 3.2;
      let id = floor(q); let f = fract(q);
      var d1 = 9.0; var cid = vec2f(0.0);

        let g = vec2f(f32(x), f32(y)); let o = hash22(id + g);

        if (dd < d1) { d1 = dd; cid = id + g; }
      } }
      let h = hash12(cid);
      let cell = mix(1.0, smoothstep(0.75, 0.35, d1), 0.75 * near);
      alb = in.col * (0.5 + 0.9 * h) * cell * (0.75 + 0.5 * vnoise3(P * 9.0));
      alb = mix(alb, vec3f(0.03, 0.05, 0.02), smoothstep(0.55, 0.8, vnoise3(P * 0.9)) * 0.5);
      rough = 0.9; bumpAmt = 0.7; bumpFreq = 12.0;
    }
    case 17u: { // hazard stripes
      let s = step(0.5, fract((uv.x + uv.y) * 3.3));
      alb = mix(vec3f(0.02), in.col, s) * (0.7 + 0.4 * vnoise(uv * 14.0));
      rough = 0.5; f0 = 0.05; bumpAmt = 0.05;
    }
    default: {}
  }

  // generic micro bump
  if (bumpAmt > 0.01 && near > 0.01) {
    let e = 0.5 / bumpFreq;
    var bp = uv * bumpFreq;
    if (m == 0u || m == 6u) { bp = P.xz * bumpFreq; }
    let b0 = vnoise(bp); let bx = vnoise(bp + vec2f(0.5, 0.0)); let by = vnoise(bp + vec2f(0.0, 0.5));

    else { N = normalize(N + (T * (b0 - bx) + B * (b0 - by)) * bumpAmt * near * 1.6); }
  }

  // ------------------------------------------------------------ lighting
  let Lm = G.moonDir.xyz;
  var sh = 0.0;
  let ndlG = dot(Ng, Lm);
  if (ndlG > -0.2 || trans > 0.0) { sh = shadow(P, Ng); }
  let ndl = max(dot(N, Lm), 0.0);
  var diff = G.moonCol.rgb * (ndl + trans * 0.35 * max(-dot(N, Lm), 0.0) + trans * 0.12) * sh;
  var spec = G.moonCol.rgb * ggx(N, V, Lm, rough, f0) * sh;

  // sky ambient (hemisphere) with a little crevice darkening from the bump
  let hemi = N.y * 0.5 + 0.5;
  let amb = mix(vec3f(0.0045, 0.0052, 0.0065), vec3f(0.014, 0.021, 0.039), hemi);
  diff += amb * (0.6 + 0.4 * sh);

  // emergency lights: inverse-square with a smooth range window
  for (var i = 0; i < ${NL}; i++) {
    let l = G.lights[i];
    let d = l.pos.xyz - P;
    let d2 = dot(d, d);
    let r2 = l.pos.w * l.pos.w;
    if (d2 < r2 && l.col.a > 0.002) {
      let L = d * inverseSqrt(d2);
      let w = 1.0 - d2 / r2;
      let att = w * w / (d2 + 0.35);
      let c = l.col.rgb * l.col.a * att;
      diff += c * (max(dot(N, L), 0.0) + trans * 0.25);
      spec += c * ggx(N, V, L, rough, f0);
    }
  }
  // flashlight
  let fI = G.flPos.w;
  if (fI > 0.0) {
    let d = P - G.flPos.xyz;
    let d2 = dot(d, d);
    let L = -d * inverseSqrt(d2);
    let cone = flashCone(dot(-L, G.flDir.xyz));
    if (cone > 0.0) {
      let fc = fI * cone / (d2 + 1.5);
      let c = vec3f(1.0, 0.93, 0.80) * (fc / (1.0 + 0.15 * fc));   // inverse-square, with soft near-field compression (local eye adaptation)
      diff += c * (pow(max(dot(N, L), 0.0), 0.6) + trans * 0.2);   // rough-surface backscatter toward the holder
      spec += c * ggx(N, V, L, rough, f0);
    }
  }

  var col = alb * diff + spec + emit;
  if (wet > 0.0) {
    let R = reflect(-V, N);
    let F = f0 + (1.0 - f0) * pow(1.0 - max(dot(N, V), 0.0), 5.0);
    var refl = skyBase(normalize(vec3f(R.x, abs(R.y) + 0.02, R.z)));
    refl += G.moonCol.rgb * 0.5 * smoothstep(0.35, 0.75, fbm2(R.xz / (abs(R.y) + 0.25) * 1.4 + t * 0.006, 3)) * 0.06; // cloud reflections
    col += refl * F * wet * mix(1.0, sh, 0.3);
  }

  // ------------------------------------------------------------ fog
  let fv = -toCam;
  let f = fogFactor(fv, dist);
  col = mix(col, fogColor(-V), f);
  if (fI > 0.0) { // single-scatter approximation of the beam in haze
    let c = flashCone(dot(-V, G.flDir.xyz));
    col += vec3f(1.0, 0.93, 0.80) * fI * (c * 0.4 + 0.6 * smoothstep(0.90, 0.985, dot(-V, G.flDir.xyz))) * 0.00007 * (1.0 - exp(-dist * 0.22)) * (0.7 + 60.0 * G.misc.x);
  }
  return vec4f(col, 1.0);
}
`;

const WGSL_SKY = WGSL_COMMON + /* wgsl */`
struct VOut { @builtin(position) clip: vec4f, @location(0) ndc: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VOut {
  var o: VOut;

  let d = normalize(G.camFwd.xyz + G.camRight.xyz * in.ndc.x + G.camUp.xyz * in.ndc.y);

  var c = skyBase(d);

  var stars = 0.0;

    let sc = 170.0 + 190.0 * f32(k);

  let mr = 0.022;
  let ang = acos(clamp(md, -1.0, 1.0));

    let mx = normalize(cross(G.moonDir.xyz, vec3f(0, 1, 0))); let my = cross(mx, G.moonDir.xyz);
    let q = vec2f(dot(d, mx), dot(d, my)) / mr;

    let dy = max(d.y, 0.0) + 0.12;
    let uv = d.xz / dy;
    let w = vec2f(t * 0.012, t * 0.005);

    let n2 = fbm2(uv * 1.7 + w * 2.3 + 13.0, 4);

    let thick = smoothstep(0.5, 0.95, n + n2 * 0.2);
    let mm = max(md, 0.0);
    var cc = vec3f(0.012, 0.016, 0.026) * (1.0 - 0.6 * thick);
    cc += G.moonCol.rgb * (0.02 + 0.10 * pow(mm, 4.0) + 0.55 * pow(mm, 40.0)) * (1.0 - thick * 0.85); // silver lining

  sky += G.moonCol.rgb * (0.9 * pow(max(md, 0.0), 2500.0) + 0.10 * pow(max(md, 0.0), 300.0));

  sky = mix(sky, fogColor(d), smoothstep(0.10, -0.01, d.y));
  return vec4f(sky, 1.0);
}
`;

const WGSL_SPRITES = WGSL_COMMON + /* wgsl */`
struct VOut { @builtin(position) clip: vec4f, @location(0) uv: vec2f, @location(1) col: vec3f, @location(2) kind: f32 };
fn corner(i: u32) -> vec2f {
  let x = array<f32, 6>(-1, 1, -1, -1, 1, 1); let y = array<f32, 6>(-1, -1, 1, 1, -1, 1);
  return vec2f(x[i], y[i]);
}
// light halos -------------------------------------------------------
@vertex fn vsGlow(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
  var o: VOut;
  let l = G.lights[ii];
  let c = corner(vi);
  let R = normalize(G.camRight.xyz); let U = normalize(G.camUp.xyz);
  let dist = distance(l.pos.xyz, G.camPos.xyz);
  let size = l.glow.x * (1.0 + dist * 0.012);

  o.clip = G.viewProj * vec4f(p, 1.0);

}
// dust in the air + embers ------------------------------------------
@vertex fn vsPart(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
  var o: VOut;
  let c = corner(vi);
  let t = G.camPos.w;
  let h = hash33(vec3f(f32(ii) * 1.37, f32(ii) * 0.71 + 3.0, 9.0));
  let R = normalize(G.camRight.xyz); let U = normalize(G.camUp.xyz);

    let Bx = vec3f(22.0, 9.0, 22.0);
    let w = h * Bx + vec3f(0.13, -0.035, 0.07) * t + vec3f(sin(t * 0.4 + h.x * 20.0), sin(t * 0.3 + h.y * 20.0), cos(t * 0.35 + h.z * 20.0)) * 0.12;

    let dist = length(rel);
    size = (0.0028 + 0.0035 * h.x) * (1.0 + dist * 0.10);
    let fade = smoothstep(11.0, 7.0, dist) * smoothstep(0.25, 0.8, dist);

    let d = p - G.flPos.xyz; let d2 = dot(d, d);

    for (var i = 0; i < ${NL}; i++) {
      let l = G.lights[i]; let ld = l.pos.xyz - p; let l2 = dot(ld, ld);
      if (l2 < l.pos.w * l.pos.w) { col += l.col.rgb * l.col.a / (l2 + 0.5) * 0.12 * fade; }

  } else {
    // embers from the barrel fire (light 3)
    let src = G.lights[3].pos.xyz;
    let life = fract(t * (0.25 + 0.35 * h.x) + h.y);
    p = src + vec3f((h.z - 0.5) * 0.4 + sin(life * 9.0 + h.x * 30.0) * 0.18 * life, -0.35 + life * (1.6 + 2.6 * h.y), (h.x - 0.5) * 0.4 + cos(life * 7.0 + h.z * 30.0) * 0.18 * life) + vec3f(0.5, 0.0, 0.2) * life * life;

  let r = length(in.uv);

  if (in.kind < 0.5) { a = pow(max(1.0 - r, 0.0), 3.0) * 0.5 + pow(max(1.0 - r * 4.0, 0.0), 2.0) * 2.0; }

`;

const WGSL_POST = /* wgsl */`
struct VOut { @builtin(position) clip: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VOut {
  var o: VOut;

@group(0) @binding(2) var<uniform> U: PU;

@fragment fn fsBlur(in: VOut) -> @location(0) vec4f {

  c += (textureSampleLevel(tex, smp, in.uv + d * 1.3846154, 0.0).rgb + textureSampleLevel(tex, smp, in.uv - d * 1.3846154, 0.0).rgb) * 0.3162162;

@group(0) @binding(3) var bloomTex: texture_2d<f32>;
fn h12(p: vec2f) -> f32 { var p3 = fract(vec3f(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
@fragment fn fsFinal(in: VOut) -> @location(0) vec4f {

  c = (c + b * 0.55) * U.a.x;
  let q = in.uv - 0.5;

  c = pow(max(c, vec3f(0.0)), vec3f(1.0 / 2.2));

  c += (n - 0.5) * (0.035 * (1.0 - l) + 0.006);                                    // film grain + dither
  return vec4f(c, 1.0);
}
`;

// ------------------------------------------------------------ utilities
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1', CAPTURE = DEMO && Q.has('capture');   // ?demo=1 automated 25 s tour; &capture=1 fixed 30 fps timestep
const SEED = (parseInt(Q.get('seed')) || 1337) | 0;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(SEED);
const rr = (a, b) => a + (b - a) * rnd();

    state.flI += ((state.fl ? 1 : 0) - state.flI) * (1 - Math.exp(-dt * 22));
    GU[48] = pe[0] + PR[0] * .16 + PF[0] * .1; GU[49] = pe[1] - .17; GU[50] = pe[2] + PR[2] * .16 + PF[2] * .1;
    GU[51] = state.flI < .003 ? 0 : 150 * state.flI * (.97 + .03 * noise1(state.time * 13));
    { const o = [GU[48], GU[49], GU[50]], d = [flD[0] / fl, flD[1] / fl, flD[2] / fl]; let bd = beamDist(o, d);
      for (let q = 0; q < 8; q++) { const a = (q & 1 ? 1 : -1) * (q & 4 ? .08 : .17), v = q & 2; bd = Math.min(bd, (q & 4 ? 1.25 : 1.7) * beamDist(o, norm3([d[0] + (v ? 0 : PR[0] * a), d[1] + (v ? a : 0), d[2] + (v ? 0 : PR[2] * a)]))); }

    GU[52] = flD[0] / fl; GU[53] = flD[1] / fl; GU[54] = flD[2] / fl;
    GU[64] = .0052; GU[65] = 1; GU[66] = rt.w; GU[67] = rt.h;
    for (let i = 0; i < NL; i++) { const l = LIGHTS[i], o = 68 + i * 12; GU[o] = l.p[0]; GU[o + 1] = l.p[1]; GU[o + 2] = l.p[2]; GU[o + 3] = l.range; GU[o + 4] = l.c[0]; GU[o + 5] = l.c[1]; GU[o + 6] = l.c[2]; GU[o + 7] = flick(l, state.time); GU[o + 8] = l.glow[0]; GU[o + 9] = l.glow[1]; }
    device.queue.writeBuffer(gbuf, 0, GU);

        '\nresolution  ' + rt.w + ' x ' + rt.h + (MS > 1 ? '  MSAA ' + MS + 'x' : '') + (state.scale < 1 ? '  (' + state.scale * 100 + '%)' : '') +
        '\ncamera      ' + eye[0].toFixed(1) + ', ' + eye[1].toFixed(1) + ', ' + eye[2].toFixed(1) + '\nheading     ' + ((((cam.yaw * 180 / Math.PI) % 360) + 360) % 360).toFixed(0) + '°  pitch ' + (cam.pitch * 180 / Math.PI).toFixed(0) + '°' +
        '\nscene       ' + (W.ni / 3 / 1e6).toFixed(2) + 'M tris, ' + W.chunks.length + ' chunks\nworld gen   ' + genMs.toFixed(0) + ' ms' + (gpuErrors.length ? '\nGPU ERRORS  ' + gpuErrors.length : '');
